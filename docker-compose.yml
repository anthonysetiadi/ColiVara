services:
  web:
    build: ./web
    ports:
      - '8001:8000'

    command: uvicorn config.asgi:application --reload --host 0.0.0.0 --port 8000

    volumes:
      - ./web:/code
      - ./Media:/app/Media
    depends_on:
      - db
    env_file:
      - ./.env.dev

  gotenberg:
    image: gotenberg/gotenberg:8

  db:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data_gdrive:/var/lib/postgresql/data/
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
      - POSTGRES_DB=colivara_db
      - POSTGRES_USER=colivara_user
      - POSTGRES_PASSWORD=colivara_password

volumes:
  postgres_data_gdrive:
